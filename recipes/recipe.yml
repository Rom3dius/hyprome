---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hyprome
# description will be included in the image's metadata
description: hyprome; my personal OS image

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/hyprland
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  # Install additional packages
  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      - https://copr.fedorainfracloud.org/coprs/che/nerd-fonts/repo/fedora-44/che-nerd-fonts-fedora-44.repo
      - https://download.opensuse.org/repositories/home:TheLocehiliosan:yadm/Fedora_Rawhide/home:TheLocehiliosan:yadm.repo
      - https://copr.fedorainfracloud.org/coprs/tofik/nwg-shell/repo/fedora-44/tofik-nwg-shell-fedora-44.repo
    install:
      # Hyprland extras
      # NOTE: `swww` was previously installed here to override wayblue's
      # hyprpaper default, but it's not available in any currently-enabled
      # repo for Fedora 44 (not in tofik/nwg-shell or wayblue's own
      # craftidore/wayblueorg-hyprland COPR, and solopasha/hyprland — a
      # common source for it — has no f44 build yet). Dropped rather than
      # chasing a new COPR: caelestia-shell now owns wallpaper management
      # directly, making both swww and wayblue's own hyprpaper redundant —
      # see the `remove:` list below.
      - hyprpolkitagent
      - nwg-displays
      # Shell & CLI tools
      - zsh
      - nerd-fonts
      - yadm
      - lsd
      - fastfetch
      - cliphist
      - zoxide
      - below
      - gitleaks
      - rsync
      # Image/PDF viewers (GUI apps for yazi openers)
      - imv
      - zathura
      - zathura-pdf-poppler
      # File manager (GNOME Nautilus, standalone — doesn't need gnome-shell)
      - nautilus
      - file-roller
      # caelestia-shell's own UI font default (config/AppearanceConfig.qml:
      # font.family.sans/clock = "Rubik"). Its mono font default,
      # CaskaydiaCove NF, isn't in Fedora repos — downloaded directly in
      # install-caelestia.sh instead.
      - google-rubik-fonts
      # System services
      - tailscale
      - moby-engine
      - podman-compose
      - inotify-tools
      - rclone
      - smartmontools
      - gparted
      - NetworkManager-tui
      # Voice-to-text (hyprvoice dependency)
      - wtype
      # GPU / Vulkan for LLM inference
      - vulkan-tools
      - mesa-vulkan-drivers
      - vulkan-loader
      # Qt theming (qt6 packages conflict with wayblue's qt6-qtbase version)
      - qt5ct
      - qt6-qtmultimedia
    remove:
      - firefox
      - firefox-langpacks
      # Superseded by caelestia-shell (bar/launcher/notifications/lock/wallpaper).
      # See files/scripts/install-caelestia.sh for the caelestia-side packages.
      # (rofi-wayland is NOT listed here despite being wofi/dunst's usual
      # companion — it isn't actually present in wayblue's published image,
      # and `rpm-ostree override remove` hard-fails with an opaque
      # "conflicting requests" error if asked to remove a package that was
      # never installed, unlike plain `dnf5 remove` which just skips it.
      # pavucontrol is NOT listed either — caelestia's default audioSettings
      # var wants `pwvucontrol`, but that package isn't available in any
      # repo we have enabled for Fedora 44, so pavucontrol stays as the only
      # audio mixer actually installed; hypr-vars.lua overrides audioSettings
      # to match. kitty is NOT listed either — kept as the terminal instead
      # of switching to foot; hypr-vars.lua overrides terminal to match.
      - waybar
      - wofi
      - dunst
      - hyprlock
      - hyprpaper
      # fzf comes from wayblue's own base image; fd is provided natively via
      # Homebrew in hyprome-dev-dots' Brewfile (along with lazygit/ripgrep) —
      # both are dev-tooling duplicates once the Brewfile is applied
      - fzf
      # File manager: keeping GNOME's Nautilus (via nautilus package below)
      # instead of caelestia's default Thunar — drop Thunar's plugins.
      # (`thunar` itself isn't actually installed in wayblue's image despite
      # its plugins being present — same "not actually installed" class of
      # issue hit with rofi-wayland earlier; omitted for the same reason:
      # `rpm-ostree override remove` hard-fails on packages that aren't
      # there.) gvfs-* backends stay (shared VFS layer, not Thunar-specific).
      - thunar-archive-plugin
      - thunar-volman
      - xarchiver

  # caelestia-dots desktop shell (quickshell-based). Builds/installs
  # caelestia-shell + caelestia-cli from source and their COPR/build deps
  # (waybar/rofi/wofi/dunst/hyprlock/hyprpaper/kitty/pavucontrol are removed
  # above, superseded by caelestia-shell). caelestia's own
  # hypr/hyprland/execs.lua already exec's `caelestia shell -d` on start, so
  # no exec-once needs adding on the hyprome-dev-dots side.
  - type: script
    scripts:
      - install-caelestia.sh

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          # you can override the title to make inclusion of both system and user repos clearer
          title: Flathub (user)
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        install:
          - com.brave.Browser
          - io.github.dvlv.boxbuddyrs
          - io.podman_desktop.PodmanDesktop
          - com.github.tchx84.Flatseal
          - org.gnome.Loupe
          - org.flameshot.Flameshot
          - io.mpv.Mpv

  - type: bling
    install:
      - 1password

  - type: soar
    additional-repos: true
    auto-upgrade: true
    upgrade-interval: "3h"

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - podman-auto-update.timer
    user:
      enabled:
        - sync-dots.service
        - setup-hyprvoice.service
        - hyprvoice.service
